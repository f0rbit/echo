<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>walls-autotile sheet inspector</title>
<style>
  body { background: #222; color: #eee; font-family: monospace; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(12, 96px); gap: 8px; }
  .tile { width: 96px; height: 96px; position: relative; border: 1px solid #444; background: #444; }
  .tile canvas { display: block; }
  .label { position: absolute; bottom: 2px; left: 2px; font-size: 10px; color: #0f0; background: rgba(0,0,0,0.6); padding: 1px 3px; border-radius: 2px; }
</style>
</head>
<body>
<h2>walls-autotile.png (192x64, 12x4 tiles of 16x16) - labels are (col,row)</h2>
<div class="grid" id="g"></div>
<script>
const grid = document.getElementById("g");
const COLS = 12, ROWS = 4, TILE = 16;
const sheet = new Image();
sheet.onload = () => {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "tile";
      const canvas = document.createElement("canvas");
      canvas.width = TILE;
      canvas.height = TILE;
      canvas.style.width = "96px";
      canvas.style.height = "96px";
      canvas.style.imageRendering = "pixelated";
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sheet, c * TILE, r * TILE, TILE, TILE, 0, 0, TILE, TILE);
      cell.appendChild(canvas);
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = c + "," + r;
      cell.appendChild(label);
      grid.appendChild(cell);
    }
  }
};
sheet.src = "walls-autotile.png";
</script>
</body>
</html>
